<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared wishlist</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Shared wishlist</h1>
  </header>
  <main class="layout">
    <section aria-labelledby="shared-title">
      <h2 id="shared-title">Wishlist</h2>
      <p class="status" id="shared-status">Loading…</p>
      <ul class="wishlist-items" id="shared-list" data-testid="shared-list"></ul>
      <p class="wishlist-total" id="shared-total" data-testid="shared-total"></p>
    </section>
  </main>
  <script type="module" src="/shared.js"></script>
</body>
</html>
