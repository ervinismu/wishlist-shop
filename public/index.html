<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist Shop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Wishlist Shop</h1>
    <p class="tagline">Find something nice. Save it for later.</p>
    <button type="button" id="theme-toggle" class="secondary" aria-pressed="false">Switch to dark mode</button>
  </header>

  <main class="layout">
    <section aria-labelledby="products-title">
      <h2 id="products-title">Products</h2>
      <div class="product-search">
        <label for="product-search">Search products</label>
        <input type="search" id="product-search">
        <label for="category-filter">Category</label>
        <select id="category-filter">
          <option value="">All categories</option>
        </select>
      </div>
      <p class="status" id="products-status">Loading products…</p>
      <p class="status" id="action-status" role="alert"></p>
      <ul class="product-grid" id="product-list" data-testid="product-list"></ul>
    </section>

    <aside class="wishlist" aria-labelledby="wishlist-title">
      <h2 id="wishlist-title">Your wishlist</h2>
      <p class="status" id="wishlist-status">Loading…</p>
      <div class="wishlist-controls">
        <label for="wishlist-search">Search</label>
        <input type="search" id="wishlist-search" placeholder="Search by name">
        <label for="wishlist-sort">Sort by</label>
        <select id="wishlist-sort">
          <option value="added">Date added</option>
          <option value="name">Name</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </div>
      <ul class="wishlist-items" id="wishlist-list" data-testid="wishlist-list"></ul>
      <p class="wishlist-total" id="wishlist-total" data-testid="wishlist-total"></p>
      <button type="button" id="csv-button">Download CSV</button>
      <p class="status" id="csv-status" role="alert"></p>
      <button type="button" id="share-button">Share</button>
      <div id="share-result" hidden>
        <label for="share-link">Share link</label>
        <input type="text" id="share-link" readonly>
        <button type="button" id="copy-button">Copy link</button>
        <button type="button" id="unshare-button">Stop sharing</button>
      </div>
      <p class="status" id="share-status" role="alert"></p>
    </aside>
  </main>

  <script type="module" src="/theme-init.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
